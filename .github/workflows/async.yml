name: Sync Assets to Cloudflare R2

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - ".github/workflows/async.yml"
  workflow_dispatch:

concurrency:
  group: r2-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Package & upload assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # .import/.uid stay in git (they hold UIDs); everything else ships to R2.
      - name: Build assets archive
        run: |
          set -euo pipefail
          tar -czf assets.tar.gz \
            --exclude='*.import' \
            --exclude='*.uid' \
            --exclude='__MACOSX' \
            --exclude='.DS_Store' \
            assets/
          ls -lh assets.tar.gz
          sha256sum assets.tar.gz | awk '{print $1"  assets.tar.gz"}' > assets.sha256
          cat assets.sha256

      - name: Upload archive to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp assets.tar.gz "s3://${R2_BUCKET}/assets.tar.gz" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/gzip" \
            --cache-control "public, max-age=300"
          aws s3 cp assets.sha256 "s3://${R2_BUCKET}/assets.sha256" \
            --endpoint-url "$ENDPOINT" \
            --content-type "text/plain" \
            --cache-control "public, max-age=300"

      - name: Summary
        run: |
          {
            echo "**Assets synced to R2**"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Archive | \`assets.tar.gz\` |"
            echo "| Checksum | \`$(cat assets.sha256)\` |"
            echo "| Size | $(du -h assets.tar.gz | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"